      description: ISO 4217 balance currency.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum:
      - USD
    available_balance:
      type: string
      description: Current available balance.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      pattern: ^-?[0-9]+\.[0-9]{2}$
      format: decimal
      enum: []
    as_of:
