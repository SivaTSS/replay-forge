schema_version: '1.4'
capability:
  id: member.temporary_card_lock
  version: 1.0.0
  name: Temporarily lock card
  description: Observe the non-restrictive member review notice that blocks card maintenance.
    After marking the blocker, verify the member record and acknowledge only that
    notice. Restore the exact pre-divergence surface at the runtime-supplied rejoin
    boundary, then stop. Preserve values entered before the notice; do not prefill
    later task fields, change permissions, or apply a lock within the correction.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags: []
