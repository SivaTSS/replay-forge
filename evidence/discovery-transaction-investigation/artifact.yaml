schema_version: '1.4'
capability:
  id: member.transaction_investigation
  version: 1.0.0
  name: Investigate member transaction
  description: For the supplied synthetic member, open Checking, search transactions
    using the supplied merchant, transaction date, and amount, open the single exact
    match, and return the requested transaction details.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags:
  - member_service
  - transaction_investigation
  - read_only
  - financial_data
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants:
  - harbor
  - summit
  surface_contract: web.v1
  entry_point: visual_member_workbench
  rendered_surface: true
  fingerprint:
    required_landmarks:
    - kind: visual_text
      value: NORTHSTAR MEMBER SERVICE
    forbidden_landmarks: []
inputs:
  type: object
  additional_properties: false
  required:
  - member_id
  - merchant
  - transaction_date
  - amount
  properties:
    member_id:
      type: string
      description: Invocation value for member id.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    merchant:
      type: string
      description: Invocation value for merchant.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    transaction_date:
      type: string
      description: Invocation value for transaction date.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    amount:
      type: string
      description: Invocation value for amount.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
outputs:
  type: object
  additional_properties: false
  required:
  - transaction_reference
  - merchant
  - posted_date
  - amount
  - currency
  - status
  properties:
    transaction_reference:
      type: string
      description: Reference identifying the exact matched transaction.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    merchant:
      type: string
      description: Merchant associated with the exact matched transaction.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    posted_date:
      type: string
      description: Posted date shown for the exact matched transaction.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    amount:
      type: string
      description: Amount shown for the exact matched transaction.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    currency:
      type: string
      description: Currency shown for the exact matched transaction.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    status:
      type: string
      description: Status shown for the exact matched transaction.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
