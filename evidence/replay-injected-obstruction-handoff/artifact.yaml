outcomes:
- code: member_not_found
  description: Observe and verify that the supplied member does not exist. Stop without
    choosing another member.
  detect:
    kind: rendered_text
    value: No matching members. Refine the inquiry; no record was selected.
    match: exact
  allowed_after_steps:
  - step_02_click_search_button
  result:
    status: business_outcome
    details: {}
- code: quote_date_unavailable
  description: Observe why a quote cannot be issued for the requested date outside
    the application's allowed window. Keep the requested date unchanged and stop at
    the verified notice.
  detect:
    kind: rendered_text
    value: 'date_window: Quote date must be within 30 days of the business date, inclusive.'
    match: exact
  allowed_after_steps:
  - step_06_click_calculate_payoff_button
  result:
    status: business_outcome
    details: {}
failures:
- code: invalid_payoff_date
  description: Observe the application's rejection of the invalid calendar date. Do
    not correct or substitute the caller's date and do not issue a quote.
  detect:
    kind: rendered_text
    value: 'invalid_date: That calendar date does not exist.'
    match: exact
  allowed_after_steps:
  - step_06_click_calculate_payoff_button
  expected_state: the requested operation is unavailable
  observed_state: Observe the application's rejection of the invalid calendar date.
    Do not correct or substitute the caller's date and do not issue a quote.
  recoverable: false
- code: member_restricted
  description: Verify that servicing is restricted for the selected member. Stop without
    changing roles, acknowledging away the restriction, or issuing a quote.
  detect:
    kind: rendered_text
    value: Restricted servicing. Contact branch supervisor.
    match: exact
  allowed_after_steps:
  - step_03_click_open_button_for_the_single_member_inquir
  expected_state: the requested operation is unavailable
  observed_state: Verify that servicing is restricted for the selected member. Stop
    without changing roles, acknowledging away the restriction, or issuing a quote.
  recoverable: false
