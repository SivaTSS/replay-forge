schema_version: '1.4'
capability:
  id: member.loan_payoff_quote
  version: 1.0.0
  name: Calculate Auto Loan Payoff Quote
  description: For the specified synthetic member, open the Auto loan, calculate a
    payoff quote using the supplied payoff date, and return the quote details without
    submitting a payment.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags:
  - member_service
  - auto_loan
  - payoff_quote
  - financial
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants:
  - harbor
  - summit
  surface_contract: web.v1
  entry_point: visual_member_workbench
  rendered_surface: true
  fingerprint:
    required_landmarks:
    - kind: visual_text
      value: NORTHSTAR MEMBER SERVICE
    forbidden_landmarks: []
inputs:
  type: object
  additional_properties: false
  required:
  - member_id
  - payoff_date
  properties:
    member_id:
      type: string
      description: Invocation value for member id.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    payoff_date:
      type: string
      description: Invocation value for payoff date.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
outputs:
  type: object
  additional_properties: false
  required:
  - principal_balance
  - accrued_interest
  - payoff_amount
  - currency
  - good_through_date
  properties:
    principal_balance:
      type: string
      description: Principal balance shown in the payoff quote.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    accrued_interest:
      type: string
      description: Accrued interest shown in the payoff quote.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    payoff_amount:
      type: string
      description: Total payoff amount shown in the quote.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    currency:
      type: string
      description: Currency indicated for the payoff quote amounts.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    good_through_date:
      type: string
      description: Date through which the payoff quote is valid.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
