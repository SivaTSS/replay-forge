[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "replayforge"
version = "0.1.0"
description = "Discover UI workflows and replay them as deterministic capabilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ReplayForge contributors" }]
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "ruff==0.11.0",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["replayforge"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["replayforge"]
mypy_path = "backend/src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
