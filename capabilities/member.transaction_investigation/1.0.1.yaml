schema_version: '1.4'
capability:
  id: member.transaction_investigation
  version: 1.0.1
  name: Investigate member transaction
  description: Locate the transaction identified by transaction_reference within account_id
    for member_id, verify that the returned transaction reference and account identity
    match the supplied inputs, and return the requested transaction details without
    changing account or transaction state.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags:
  - member_servicing
  - transaction_research
  - identity_verification
  - no_state_change
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants:
  - harbor
  - summit
  surface_contract: web.v1
  entry_point: legacy_servicing
  rendered_surface: true
  fingerprint:
    required_landmarks:
    - kind: visual_text
      value: Branch member directory
    forbidden_landmarks: []
inputs:
  type: object
  additional_properties: false
  required:
  - member_id
  - account_id
  - transaction_reference
  properties:
    member_id:
      type: string
      description: Invocation value for member id.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    account_id:
      type: string
      description: Invocation value for account id.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    transaction_reference:
      type: string
      description: Invocation value for transaction reference.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
outputs:
  type: object
  additional_properties: false
  required:
  - transaction_reference
  - account_id
  - amount
  - posted_date
  - description
  - posting_status
  properties:
    transaction_reference:
      type: string
      description: Verified transaction reference from the actual transaction details.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    account_id:
      type: string
      description: Verified account identity associated with the transaction.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    amount:
      type: string
      description: Transaction amount from the actual transaction details.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    posted_date:
      type: string
      description: Transaction posted date from the actual transaction details.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    description:
      type: string
      description: Transaction description from the actual transaction details.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    posting_status:
      type: string
      description: Transaction posting status from the actual transaction details.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
