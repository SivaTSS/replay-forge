schema_version: '1.4'
capability:
  id: member.transaction_investigation
  version: 1.0.3
  name: Investigate member transaction
  description: Use the application's member search to locate the supplied member_id,
    explicitly select that member, select and verify the supplied account_id, then
    use the account's transaction search to locate and verify the supplied transaction_reference.
    Return the requested transaction details without changing account or transaction
    state, and produce an explicit no-match result when a supplied identifier cannot
    be found.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags:
  - member-services
  - transaction-research
  - identifier-verified
  - no-state-change
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants:
  - harbor
  - summit
  surface_contract: web.v1
  entry_point: legacy_servicing
  rendered_surface: true
  fingerprint:
    required_landmarks:
    - kind: visual_text
      value: Branch member directory
    forbidden_landmarks: []
inputs:
  type: object
  additional_properties: false
  required:
  - member_id
  - account_id
  - transaction_reference
  properties:
    member_id:
      type: string
      description: Invocation value for member id.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    account_id:
      type: string
      description: Invocation value for account id.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    transaction_reference:
      type: string
      description: Invocation value for transaction reference.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
outputs:
  type: object
  additional_properties: false
  required:
  - transaction_reference
  - account_id
  - amount
  - posted_date
  - description
  - posting_status
  properties:
    transaction_reference:
      type: string
      description: Reference of the located transaction, verified against the supplied
        transaction_reference.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    account_id:
      type: string
      description: Identifier of the explicitly selected account, verified against
        the supplied account_id.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    amount:
      type: string
      description: Amount shown in the actual transaction details.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    posted_date:
      type: string
      description: Posted date shown in the actual transaction details.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    description:
      type: string
      description: Transaction description shown in the actual transaction details.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    posting_status:
      type: string
      description: Posting status shown in the actual transaction details.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
