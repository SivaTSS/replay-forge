schema_version: "1.3"
capability:
  id: member.lookup_savings_balance
  version: 3.2.0
  name: Lookup savings balance — geometry-free visual replay
  description: Read a synthetic member's savings balance from the current rendered frame using semantic text, label relationships, and a content-addressed group signature.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags: [member-service, balance, read-only, vision-first, geometry-free, responsive]
compatibility:
  application_family: northstar_member_service
  base_variant: rendered-workbench
  supported_variants: [harbor, summit]
  surface_contract: web.v1
  entry_point: visual_member_workbench
  fingerprint:
    required_landmarks:
      - kind: visual_text
        value: Member Search
    forbidden_landmarks:
      - kind: visual_text
        value: System maintenance
inputs:
  type: object
  additional_properties: false
  required: [member_id]
  properties:
    member_id:
      type: string
      description: Synthetic institution member identifier.
      data_classification: customer_identifier
      persistence: redacted
      pattern: ^[0-9]{5,10}$
      min_length: 5
      max_length: 10
      example: "12345"
outputs:
  type: object
  additional_properties: false
  required: [member_id, account_type, currency, available_balance, as_of]
  properties:
    member_id:
      type: string
      description: Member identifier shown on the detail page.
      data_classification: customer_identifier
      persistence: redacted
      pattern: ^[0-9]{5,10}$
    account_type:
      type: string
      description: Selected account type.
      data_classification: financial
      persistence: redacted
      const: savings
    currency:
      type: string
      description: ISO 4217 balance currency.
      data_classification: financial
      persistence: redacted
      enum: [USD]
    available_balance:
      type: string
      description: Current available balance.
      data_classification: financial
      persistence: redacted
      format: decimal
      pattern: ^-?[0-9]+\.[0-9]{2}$
    as_of:
      type: string
      description: Timestamp displayed by the target application.
      data_classification: operational
      persistence: full
      format: date-time
preconditions:
  - kind: route
    pattern: /members/search
steps:
  - id: search.enter_member_id
    name: Enter member ID
    action:
      kind: type
      value: {source: input, path: member_id}
    target:
      description: Member ID text input associated with its rendered label
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_labeled_control
          label: Member ID
          label_match: exact
          control_kind: text_input
    retry: &safe_retry
      max_attempts: 2
      backoff_ms: [500]
      retry_on: [target_temporarily_absent]
      require_effect_absent: true
    risk: read_only
  - id: search.submit
    name: Submit search
    action: {kind: click}
    target:
      description: Rendered Search action
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_text
          value: Search
          match: exact
    postconditions:
      - kind: rendered_text
        value: Member Results
        match: exact
    timeout_ms: 2000
    retry: *safe_retry
    outcome_refs: [member_not_found]
    recovery_refs: [dismiss_known_notice]
    failure_refs: [permission_denied]
    risk: read_only
  - id: account.open_savings
    name: Open savings account
    action: {kind: click}
    target:
      description: Savings action identified by its rendered group and visual signature
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_group_image
          group_label: Savings
          group_label_match: exact
          asset_key: asset://sha256/67138a147467abd49118660295e568e7edbbf59e97f1d45509c728219e7e6802
          content_hash: sha256:67138a147467abd49118660295e568e7edbbf59e97f1d45509c728219e7e6802
    postconditions:
      - kind: rendered_text
        value: Savings Account Details
        match: exact
    retry: *safe_retry
    risk: read_only
  - id: account.extract_member_id
    name: Extract member ID
    action: {kind: extract, output: member_id, transform: trim}
    target:
      description: Value associated with the rendered Member ID label
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_field_value
          label: Member ID
          label_match: exact
    postconditions: [{kind: output_valid, output: member_id}]
    retry: *safe_retry
    risk: read_only
  - id: account.extract_account_type
    name: Extract account type
    action: {kind: extract, output: account_type, transform: lowercase}
    target:
      description: Value associated with the rendered Account type label
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_field_value
          label: Account type
          label_match: exact
    postconditions: [{kind: output_valid, output: account_type}]
    retry: *safe_retry
    risk: read_only
  - id: account.extract_currency
    name: Extract currency
    action: {kind: extract, output: currency, transform: trim}
    target:
      description: Value associated with the rendered Currency label
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_field_value
          label: Currency
          label_match: exact
    postconditions: [{kind: output_valid, output: currency}]
    retry: *safe_retry
    risk: read_only
  - id: account.extract_available_balance
    name: Extract available balance
    action: {kind: extract, output: available_balance, transform: decimal}
    target:
      description: Value associated with the rendered Available balance label
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_field_value
          label: Available balance
          label_match: exact
    postconditions: [{kind: output_valid, output: available_balance}]
    retry: *safe_retry
    risk: read_only
  - id: account.extract_as_of
    name: Extract balance timestamp
    action: {kind: extract, output: as_of, transform: date-time}
    target:
      description: Value associated with the rendered As of label
      registered_risk: read_only
      visual_candidates:
        - strategy: rendered_field_value
          label: As of
          label_match: exact
    postconditions: [{kind: output_valid, output: as_of}]
    retry: *safe_retry
    risk: read_only
recoveries:
  - id: dismiss_known_notice
    trigger:
      kind: rendered_text
      value: Important notice
      match: exact
    max_uses: 1
    steps:
      - id: recovery.dismiss_known_notice
        name: Dismiss known informational notice
        action: {kind: click}
        target:
          description: Rendered Continue action
          registered_risk: read_only
          visual_candidates:
            - strategy: rendered_text
              value: Continue
              match: exact
        postconditions:
          - kind: rendered_text
            value: Member Results
            match: exact
        retry: *safe_retry
        risk: read_only
    resume_at: account.open_savings
outcomes:
  - code: member_not_found
    description: The search completed and no matching member exists.
    detect:
      kind: all
      conditions:
        - {kind: rendered_text, value: No member found, match: exact}
        - {kind: route, pattern: /members/search}
    allowed_after_steps: [search.submit]
    result:
      status: business_outcome
      details:
        member_id: {source: input, path: member_id}
failures:
  - code: permission_denied
    description: The current role cannot view the requested member record.
    detect:
      kind: rendered_text
      value: Permission denied
      match: exact
    allowed_after_steps: [search.submit]
    expected_state: member_results
    observed_state: permission_denied
    recoverable: false
checkpoint:
  id: savings_balance_verified
  condition:
    kind: all
    conditions:
      - {kind: rendered_text, value: Savings Account Details, match: exact}
      - {kind: rendered_text, value: Savings, match: exact}
      - {kind: output_valid, output: member_id}
      - {kind: output_valid, output: account_type}
      - {kind: output_valid, output: currency}
      - {kind: output_valid, output: available_balance}
      - {kind: output_valid, output: as_of}
      - {kind: identity_matches, extracted_output: member_id, input_path: member_id}
policy:
  allowed_action_types: [type, click, extract]
  allowed_entry_points: [visual_member_workbench]
  maximum_risk: read_only
  forbidden_text_inputs: [password, security answer]
  output_redaction: {member_id: last4}
provenance:
  discovery_run_id: run_33333333333333333333333333333333
  provider: reviewed-geometry-free-visual-seed
  model: not-applicable
  prompt_policy_version: 1.3.0
  surface_adapter_version: web.v1
  compiler_version: 1.3.0
  created_at: "2026-09-12T12:30:00Z"
