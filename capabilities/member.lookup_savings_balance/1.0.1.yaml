schema_version: "1.0"
capability:
  id: member.lookup_savings_balance
  version: 1.0.1
  name: Lookup savings balance
  description: Look up a synthetic member and return the current savings balance.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags: [member-service, balance, read-only, bounded-recovery]
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants: [harbor, summit]
  surface_contract: web.v1
  entry_point: member_search
  fingerprint:
    required_landmarks:
      - kind: heading
        value: Member Search
    forbidden_landmarks:
      - kind: text
        value: System maintenance
inputs:
  type: object
  additional_properties: false
  required: [member_id]
  properties:
    member_id:
      type: string
      description: Synthetic institution member identifier.
      data_classification: customer_identifier
      persistence: redacted
      pattern: ^[0-9]{5,10}$
      min_length: 5
      max_length: 10
      example: "12345"
outputs:
  type: object
  additional_properties: false
  required: [member_id, account_type, currency, available_balance, as_of]
  properties:
    member_id:
      type: string
      description: Member identifier shown on the detail page.
      data_classification: customer_identifier
      persistence: redacted
      pattern: ^[0-9]{5,10}$
    account_type:
      type: string
      description: Selected account type.
      data_classification: financial
      persistence: redacted
      const: savings
    currency:
      type: string
      description: ISO 4217 balance currency.
      data_classification: financial
      persistence: redacted
      enum: [USD]
    available_balance:
      type: string
      description: Current available balance.
      data_classification: financial
      persistence: redacted
      format: decimal
      pattern: ^-?[0-9]+\.[0-9]{2}$
    as_of:
      type: string
      description: Timestamp displayed by the target application.
      data_classification: operational
      persistence: full
      format: date-time
preconditions:
  - kind: route
    pattern: /members/search
steps:
  - id: scenario.select_known_interstitial
    name: Select known interstitial scenario
    action:
      kind: select
      option:
        source: literal
        value: Known interstitial
    target:
      description: Runtime scenario selector
      scope: &member_frame
        frame_path:
          - locator:
              strategy: title
              value: Member operations
      candidates:
        - strategy: label
          value: Runtime scenario
    retry: &safe_retry
      max_attempts: 2
      backoff_ms: [500]
      retry_on: [target_temporarily_absent]
      require_effect_absent: true
    risk: read_only
  - id: search.enter_member_id
    name: Search Enter Member Id
    action:
      kind: type
      value:
        source: input
        path: member_id
    target:
      description: Member ID field
      scope: *member_frame
      candidates:
        - strategy: label
          value: Member ID
    retry: *safe_retry
    risk: read_only
  - id: search.submit
    name: Search Submit
    action:
      kind: click
    target:
      description: Search button
      scope: *member_frame
      candidates:
        - strategy: role_name
          role: button
          name: Search
    postconditions:
      - kind: text
        value: Member Results
        match: exact
    timeout_ms: 500
    retry: *safe_retry
    outcome_refs: [member_not_found]
    recovery_refs: [dismiss_known_notice]
    risk: read_only
  - id: account.open_savings
    name: Account Open Savings
    action:
      kind: click
    target:
      description: Savings account details link
      scope: *member_frame
      candidates:
        - strategy: role_name
          role: link
          name: View details
    postconditions:
      - kind: route
        pattern: /accounts/*/details
    retry: *safe_retry
    risk: read_only
  - id: account.extract_member_id
    name: Account Extract Member Id
    action:
      kind: extract
      output: member_id
      transform: trim
    target:
      description: Member ID value
      scope: *member_frame
      candidates:
        - strategy: relative_text
          anchor: Member ID
          relation: following_value
          element: dd
    postconditions:
      - kind: output_valid
        output: member_id
    retry: *safe_retry
    risk: read_only
  - id: account.extract_account_type
    name: Account Extract Account Type
    action:
      kind: extract
      output: account_type
      transform: lowercase
    target:
      description: Account type value
      scope: *member_frame
      candidates:
        - strategy: relative_text
          anchor: Account type
          relation: following_value
          element: dd
    postconditions:
      - kind: output_valid
        output: account_type
    retry: *safe_retry
    risk: read_only
  - id: account.extract_currency
    name: Account Extract Currency
    action:
      kind: extract
      output: currency
      transform: trim
    target:
      description: Currency value
      scope: *member_frame
      candidates:
        - strategy: relative_text
          anchor: Currency
          relation: following_value
          element: dd
    postconditions:
      - kind: output_valid
        output: currency
    retry: *safe_retry
    risk: read_only
  - id: account.extract_available_balance
    name: Account Extract Available Balance
    action:
      kind: extract
      output: available_balance
      transform: decimal
    target:
      description: Available balance value
      scope: *member_frame
      candidates:
        - strategy: relative_text
          anchor: Available balance
          relation: following_value
          element: dd
    postconditions:
      - kind: output_valid
        output: available_balance
    retry: *safe_retry
    risk: read_only
  - id: account.extract_as_of
    name: Account Extract As Of
    action:
      kind: extract
      output: as_of
      transform: date-time
    target:
      description: Balance timestamp value
      scope: *member_frame
      candidates:
        - strategy: relative_text
          anchor: As of
          relation: following_value
          element: dd
    postconditions:
      - kind: output_valid
        output: as_of
    retry: *safe_retry
    risk: read_only
recoveries:
  - id: dismiss_known_notice
    trigger:
      kind: text
      value: Important notice
      match: exact
    max_uses: 1
    steps:
      - id: recovery.dismiss_known_notice
        name: Dismiss known informational notice
        action:
          kind: click
        target:
          description: Continue notice link
          scope: *member_frame
          candidates:
            - strategy: role_name
              role: link
              name: Continue
        postconditions:
          - kind: text
            value: Member Results
            match: exact
        retry: *safe_retry
        risk: read_only
    resume_at: account.open_savings
outcomes:
  - code: member_not_found
    description: The search completed and no matching member exists.
    detect:
      kind: all
      conditions:
        - kind: text
          value: No member found
          match: exact
        - kind: route
          pattern: /members/search
    allowed_after_steps: [search.submit]
    result:
      status: business_outcome
      details:
        member_id:
          source: input
          path: member_id
checkpoint:
  id: savings_balance_verified
  condition:
    kind: all
    conditions:
      - kind: route
        pattern: /accounts/*/details
      - kind: text
        value: Savings
        match: exact
      - kind: output_valid
        output: member_id
      - kind: output_valid
        output: account_type
      - kind: output_valid
        output: currency
      - kind: output_valid
        output: available_balance
      - kind: output_valid
        output: as_of
      - kind: identity_matches
        extracted_output: member_id
        input_path: member_id
policy:
  allowed_action_types: [select, type, click, extract]
  allowed_entry_points: [member_search]
  maximum_risk: read_only
  forbidden_text_inputs: [password, security answer]
  output_redaction:
    member_id: last4
provenance:
