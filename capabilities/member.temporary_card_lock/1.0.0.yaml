schema_version: '1.4'
capability:
  id: member.temporary_card_lock
  version: 1.0.0
  name: Temporarily lock a member card
  description: For the specified synthetic member and card last four digits, open
    Checking and Card controls, review and confirm a temporary card lock, verify that
    an Unlock card inverse operation is visibly available, and return the card details
    and confirmation information.
  application_family: northstar_member_service
  surface: web
  risk: reversible
  tags:
  - member
  - card_controls
  - temporary_lock
  - confirmation
  - inverse_operation
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants:
  - harbor
  - summit
  surface_contract: web.v1
  entry_point: visual_member_workbench
  rendered_surface: true
  fingerprint:
    required_landmarks:
    - kind: visual_text
      value: NORTHSTAR MEMBER SERVICE
    forbidden_landmarks: []
inputs:
  type: object
  additional_properties: false
  required:
  - member_id
  - card_last4
  properties:
    member_id:
      type: string
      description: Invocation value for member id.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    card_last4:
      type: string
      description: Invocation value for card last4.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
outputs:
  type: object
  additional_properties: false
  required:
  - card_last4
  - lock_status
  - effective_at
  - confirmation_reference
  properties:
    card_last4:
      type: string
      description: Last four digits of the selected card.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    lock_status:
      type: string
      description: Displayed status of the selected card after the temporary lock
        confirmation.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    effective_at:
      type: string
      description: Displayed effective time for the temporary card lock.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    confirmation_reference:
      type: string
      description: Displayed reference associated with the lock confirmation.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
