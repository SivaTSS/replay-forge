schema_version: '1.4'
capability:
  id: member.temporary_card_lock
  version: 1.0.1
  name: Temporarily lock card
  description: Verify the supplied member_id and card_id through the card-maintenance
    workflow, record the supplied maintenance reason, apply a temporary lock to the
    selected card, and verify the completed result by re-extracting card_id and checking
    that it matches the supplied card_id and that the final lock status is exactly
    locked. Return only the completed-result card_id, lock_status, and confirmation_reference.
    The observed surface does not yet expose an explicit inverse operation, so this
    capability is classified as sensitive rather than reversible.
  application_family: northstar_member_service
  surface: web
  risk: reversible
  tags:
  - member_servicing
  - card_maintenance
  - temporary_lock
  - verified_result
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants:
  - harbor
  - summit
  surface_contract: web.v1
  entry_point: legacy_servicing
  rendered_surface: true
  fingerprint:
    required_landmarks:
    - kind: visual_text
      value: Branch member directory
    forbidden_landmarks: []
inputs:
  type: object
  additional_properties: false
  required:
  - member_id
  - card_id
  - reason
  properties:
    member_id:
      type: string
      description: Invocation value for member id.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    card_id:
      type: string
      description: Invocation value for card id.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    reason:
      type: string
      description: Invocation value for reason.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
outputs:
  type: object
  additional_properties: false
  required:
  - card_id
  - lock_status
  - confirmation_reference
  properties:
    card_id:
      type: string
      description: Card identifier re-extracted from the completed result after the
        state change.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    lock_status:
      type: string
      description: Final lock status returned for the card after the temporary lock
        operation.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    confirmation_reference:
      type: string
      description: Confirmation reference returned by the completed card-lock operation.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
