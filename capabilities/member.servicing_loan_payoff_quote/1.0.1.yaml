schema_version: '1.4'
capability:
  id: member.servicing_loan_payoff_quote
  version: 1.0.1
  name: Calculate auto-loan payoff quote
  description: Find the member identified by member_id, calculate and issue a non-binding
    auto-loan payoff quote for payoff_date without making a payment or changing account
    state, then extract the completed quote values. Complete only after issuance,
    not from a review screen, and retain a replayable equality assertion that good_through_date
    equals the supplied payoff_date.
  application_family: northstar_member_service
  surface: web
  risk: read_only
  tags:
  - member_servicing
  - auto_loan
  - payoff_quote
  - read_only_calculation
  - replayable_assertion
compatibility:
  application_family: northstar_member_service
  base_variant: standard
  supported_variants:
  - harbor
  - summit
  surface_contract: web.v1
  entry_point: legacy_servicing
  rendered_surface: true
  fingerprint:
    required_landmarks:
    - kind: visual_text
      value: Branch member directory
    forbidden_landmarks: []
inputs:
  type: object
  additional_properties: false
  required:
  - member_id
  - payoff_date
  properties:
    member_id:
      type: string
      description: Invocation value for member id.
      data_classification: customer_identifier
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    payoff_date:
      type: string
      description: Invocation value for payoff date.
      data_classification: personal
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
outputs:
  type: object
  additional_properties: false
  required:
  - payoff_amount
  - good_through_date
  - confirmation_reference
  properties:
    payoff_amount:
      type: string
      description: Payoff amount returned by the issued auto-loan payoff quote.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    good_through_date:
      type: string
      description: Good-through date returned by the issued auto-loan payoff quote.
      data_classification: financial
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
    confirmation_reference:
      type: string
      description: Issuance reference returned by the completed payoff quote.
      data_classification: operational
      persistence: redacted
      required: []
      properties: {}
      additional_properties: false
      enum: []
