workflows:
  transaction_investigation:
    goal: >-
      For the synthetic member, open Checking, investigate transactions using the supplied
      merchant, transaction_date, and amount, open the single exact match, and return exactly
      transaction_reference, merchant, posted_date, amount, currency, and status.
    application_family: northstar_member_service
    tenant: harbor
    validation_tenants: [summit]
    entry_point: visual_member_workbench
    inputs:
      member_id: "12345"
      merchant: Northwind Market
      transaction_date: "2026-09-08"
      amount: "84.27"
    expected_capability_id: member.transaction_investigation
    expected_risk: read_only
    expected_inputs: [member_id, merchant, transaction_date, amount]
    expected_outputs: [transaction_reference, merchant, posted_date, amount, currency, status]
    artifact_output: capabilities/member.transaction_investigation/1.0.0.yaml
  loan_payoff_quote:
    goal: >-
      For the synthetic member, open Auto loan, calculate a payoff quote for the supplied
      payoff_date without submitting a payment, and return exactly principal_balance,
      accrued_interest, payoff_amount, currency, and good_through_date.
    application_family: northstar_member_service
    tenant: harbor
    validation_tenants: [summit]
    entry_point: visual_member_workbench
    inputs:
      member_id: "12345"
      payoff_date: "2026-09-20"
    expected_capability_id: member.loan_payoff_quote
    expected_risk: read_only
    expected_inputs: [member_id, payoff_date]
    expected_outputs: [principal_balance, accrued_interest, payoff_amount, currency, good_through_date]
    artifact_output: capabilities/member.loan_payoff_quote/1.0.0.yaml
  temporary_card_lock:
    goal: >-
      For the synthetic member, open Checking and Card controls, select card_last4, review and
      confirm a temporary card lock, verify that Unlock card is visibly available as the inverse
      operation, and return exactly card_last4, lock_status, effective_at, and confirmation_reference.
    application_family: northstar_member_service
    tenant: harbor
    validation_tenants: [summit]
    entry_point: visual_member_workbench
    inputs:
      member_id: "12345"
      card_last4: "0110"
    expected_capability_id: member.temporary_card_lock
    expected_risk: reversible
    expected_inputs: [member_id, card_last4]
    expected_outputs: [card_last4, lock_status, effective_at, confirmation_reference]
    artifact_output: capabilities/member.temporary_card_lock/1.0.0.yaml
