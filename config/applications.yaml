schema_version: "1.0"
applications:
  - application_family: northstar_member_service
    capability_namespace: member
    origin: http://127.0.0.1:3001
    surface: web
    surface_contract: web.v1
    base_variant: standard
    tenants: [harbor, summit]
    entry_points:
      legacy_servicing:
        path_template: /{tenant}/servicing
        rendered_surface: true
        required_landmarks:
          - {kind: visual_text, value: Branch member directory}
    policy:
      allowed_route_patterns:
        - /servicing
      allowed_action_types:
        [navigate, type, click, select, press_keys, scroll, wait_for, assert, extract, switch_context]
      maximum_risk: sensitive
